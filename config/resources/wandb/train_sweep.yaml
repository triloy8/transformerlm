program: cli/sweep_train.py
project: sweep_2_uniform_state_diffusion_simplestories_4k_2048
command:
  - ${env}
  - uv
  - run
  - transformerlm-sweep-train
  - --config
  - config/resources/train.toml
method: grid
metric:
  goal: minimize
  name: metrics.val_loss
parameters:
  training.max_train_iteration:
    value: 2000
  training.val_freq_iteration:
    value: 100
  checkpointing.ckpting_save_iter:
    value: 2000
  optimizer.muon.max_learning_rate:
    values:
      - 0.0018
      - 0.0022
      - 0.0027
      - 0.0033
      - 0.004
